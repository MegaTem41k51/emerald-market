<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы — EMERALD Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #0b0c10 0%, #1a1b2e 100%); 
            color: #e4e6eb; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .maintenance-box {
            max-width: 600px;
            padding: 40px;
            background: rgba(20, 22, 28, 0.8);
            border: 1px solid #2c2e36;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        p {
            color: #8a8d99;
            font-size: 18px;
            line-height: 1.6;
        }
        @media (max-width: 600px) {
            .maintenance-box { width: 90%; padding: 30px; }
            h1 { font-size: 22px; }
            p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="maintenance-box">
        <div class="icon">🔧</div>
        <h1>Простите за неудобства, но<br>в данный момент на сайте происходят технические неполадки</h1>
        <p>Сайт будет доступен от 1 часа до 12 часов</p>
    </div>

</body>
</html>
