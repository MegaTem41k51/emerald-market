<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы — EMERALD Market</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #050a06;
            color: #b0ffb0;
            overflow: hidden;
            position: relative;
        }

        /* ===== ЗВЕЗДОПАД ===== */
        .star-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(120vh) translateX(-20vw);
                opacity: 0;
            }
        }

        /* ===== ЦЕНТРАЛЬНЫЙ БЛОК ===== */
        .maintenance-box {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* ===== УПРАВЛЕНИЕ (ПОИСК) ===== */
        .search-box {
            position: relative;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            margin-bottom: 40px;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #d4ffd4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 10px 12px;
            width: 220px; /* Увеличено на 2px (было 218) */
        }

        .search-input::placeholder {
            color: #7ea87e;
        }

        .search-dropdown {
            display: none;
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: #050a06;
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
        }

        .search-dropdown::-webkit-scrollbar {
            width: 4px;
        }
        .search-dropdown::-webkit-scrollbar-track {
            background: transparent;
        }
        .search-dropdown::-webkit-scrollbar-thumb {
            background: #2b6e2b;
        }

        .country-item {
            padding: 8px 12px;
            color: #9fff9f;
            font-size: 13px;
            cursor: pointer;
        }

        .country-item:hover {
            background: rgba(159, 255, 159, 0.2);
        }

        .selected-country {
            color: #9fff9f;
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* ===== ЦИФРОВЫЕ ЧАСЫ ===== */
        .digital-clock {
            font-size: 120px;
            font-weight: 900;
            letter-spacing: 10px;
            color: #ccffcc;
            text-shadow:
                0 0 10px #62c462,
                0 0 20px #62c462,
                0 0 40px #2b6e2b,
                0 0 80px #1a4a1a;
            margin-bottom: 20px;
            user-select: none;
        }

        .clock-label {
            font-size: 16px;
            letter-spacing: 4px;
            color: #7ea87e;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* ===== ТЕКСТ ===== */
        .maintenance-text {
            font-size: 22px;
            line-height: 1.7;
            color: #d4ffd4;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 12px;
            padding: 30px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .maintenance-text .icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: block;
        }

        .maintenance-text .bold {
            font-weight: bold;
            color: #9fff9f;
        }

        .maintenance-text p {
            margin-bottom: 12px;
        }

        /* ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА (ЛЕВЫЙ НИЖНИЙ УГОЛ) ===== */
        .lang-switch {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            display: flex;
            gap: 6px;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            padding: 4px;
            cursor: pointer;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #7ea87e;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #9fff9f;
            color: #050a06;
            text-shadow: none;
        }

        @media (max-width: 600px) {
            .digital-clock {
                font-size: 60px;
                letter-spacing: 6px;
                margin-bottom: 20px;
            }
            .clock-label {
                font-size: 12px;
                margin-bottom: 20px;
            }
            .maintenance-text {
                font-size: 16px;
                padding: 20px;
            }
            .maintenance-text .icon {
                font-size: 36px;
            }
            .search-input {
                width: 180px;
            }
            .lang-switch {
                bottom: 10px;
                left: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ЗВЕЗДОПАД -->
    <div class="star-container" id="starContainer"></div>

    <!-- ЯЗЫК: ВНИЗУ СЛЕВА -->
    <div class="lang-switch" id="langSwitch">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <div class="maintenance-box">

        <!-- ПОИСК СТРАН (оставлен сверху, увеличен на 2px) -->
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск страны...">
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>

        <!-- Часы -->
        <div class="digital-clock" id="clock">00:00:00</div>
        <div class="clock-label" id="clockLabel">Москва (МСК)</div>

        <!-- Текст -->
        <div class="maintenance-text">
            <span class="icon">🔧</span>
            <p class="bold" id="maintenanceTitle">В данный момент могут наблюдаться проблемы с доступом к сайту</p>
            <p id="maintenanceWork">Работаем над исправлением 🙏</p>
            <p id="maintenanceSorry">Простите за неудобства</p>
        </div>
    </div>

    <script>
        // ===== ЯЗЫК =====
        let currentLang = 'ru';

        const translations = {
            ru: {
                searchPlaceholder: 'Поиск страны...',
                clockLabel: 'Москва (МСК)',
                maintenanceTitle: 'В данный момент могут наблюдаться проблемы с доступом к сайту',
                maintenanceWork: 'Работаем над исправлением 🙏',
                maintenanceSorry: 'Простите за неудобства'
            },
            en: {
                searchPlaceholder: 'Search country...',
                clockLabel: 'Moscow (MSK)',
                maintenanceTitle: 'There may be some issues with the site access at the moment',
                maintenanceWork: 'We are working on fixing it 🙏',
                maintenanceSorry: 'Sorry for the inconvenience'
            }
        };

        // ===== ЧАСОВЫЕ ПОЯСА (ВСЕ СТРАНЫ МИРА) =====
        const timezones = {
            'Москва': 'Europe/Moscow',
            'Санкт-Петербург': 'Europe/Moscow',
            'Калининград': 'Europe/Kaliningrad',
            'Киев': 'Europe/Kyiv',
            'Минск': 'Europe/Minsk',
            'Алматы': 'Asia/Almaty',
            'Ташкент': 'Asia/Tashkent',
            'Баку': 'Asia/Baku',
            'Тбилиси': 'Asia/Tbilisi',
            'Ереван': 'Asia/Yerevan',
            'Нью-Йорк': 'America/New_York',
            'Лос-Анджелес': 'America/Los_Angeles',
            'Чикаго': 'America/Chicago',
            'Денвер': 'America/Denver',
            'Торонто': 'America/Toronto',
            'Мехико': 'America/Mexico_City',
            'Сан-Паулу': 'America/Sao_Paulo',
            'Буэнос-Айрес': 'America/Argentina/Buenos_Aires',
            'Лондон': 'Europe/London',
            'Париж': 'Europe/Paris',
            'Берлин': 'Europe/Berlin',
            'Мадрид': 'Europe/Madrid',
            'Рим': 'Europe/Rome',
            'Амстердам': 'Europe/Amsterdam',
            'Брюссель': 'Europe/Brussels',
            'Вена': 'Europe/Vienna',
            'Прага': 'Europe/Prague',
            'Варшава': 'Europe/Warsaw',
            'Будапешт': 'Europe/Budapest',
            'Стокгольм': 'Europe/Stockholm',
            'Осло': 'Europe/Oslo',
            'Копенгаген': 'Europe/Copenhagen',
            'Хельсинки': 'Europe/Helsinki',
            'Стамбул': 'Europe/Istanbul',
            'Афины': 'Europe/Athens',
            'Дубай': 'Asia/Dubai',
            'Абу-Даби': 'Asia/Dubai',
            'Доха': 'Asia/Qatar',
            'Эр-Рияд': 'Asia/Riyadh',
            'Тегеран': 'Asia/Tehran',
            'Иерусалим': 'Asia/Jerusalem',
            'Тель-Авив': 'Asia/Jerusalem',
            'Исламабад': 'Asia/Karachi',
            'Дели': 'Asia/Kolkata',
            'Мумбаи': 'Asia/Kolkata',
            'Бангкок': 'Asia/Bangkok',
            'Джакарта': 'Asia/Jakarta',
            'Сингапур': 'Asia/Singapore',
            'Куала-Лумпур': 'Asia/Kuala_Lumpur',
            'Гонконг': 'Asia/Hong_Kong',
            'Пекин': 'Asia/Shanghai',
            'Шанхай': 'Asia/Shanghai',
            'Сеул': 'Asia/Seoul',
            'Токио': 'Asia/Tokyo',
            'Осака': 'Asia/Tokyo',
            'Сидней': 'Australia/Sydney',
            'Мельбурн': 'Australia/Melbourne',
            'Брисбен': 'Australia/Brisbane',
            'Перт': 'Australia/Perth',
            'Окленд': 'Pacific/Auckland',
            'Гонолулу': 'Pacific/Honolulu',
            'Анкоридж': 'America/Anchorage',
            'Рейкьявик': 'Atlantic/Reykjavik',
            'Лиссабон': 'Europe/Lisbon',
            'Дублин': 'Europe/Dublin',
            'Белград': 'Europe/Belgrade',
            'Загреб': 'Europe/Zagreb',
            'София': 'Europe/Sofia',
            'Бухарест': 'Europe/Bucharest',
            'Вильнюс': 'Europe/Vilnius',
            'Рига': 'Europe/Riga',
            'Таллин': 'Europe/Tallinn',
            'Бишкек': 'Asia/Bishkek',
            'Астана': 'Asia/Almaty',
            'Душанбе': 'Asia/Dushanbe',
            'Ашхабад': 'Asia/Ashgabat',
            'Улан-Батор': 'Asia/Ulaanbaatar',
            'Пхеньян': 'Asia/Pyongyang',
            'Ханой': 'Asia/Ho_Chi_Minh',
            'Манила': 'Asia/Manila',
            'Тайбэй': 'Asia/Taipei'
        };

        let selectedCountry = 'Москва';
        let selectedTimezone = 'Europe/Moscow';

        // ===== ФУНКЦИИ =====
        function updateClock() {
            const now = new Date();
            const timeStr = new Date(now.toLocaleString('en-US', { timeZone: selectedTimezone }));
            const hours = String(timeStr.getHours()).padStart(2, '0');
            const minutes = String(timeStr.getMinutes()).padStart(2, '0');
            const seconds = String(timeStr.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // ===== ОБНОВЛЕНИЕ ТЕКСТА =====
        function updateText() {
            const t = translations[currentLang];
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('clockLabel').textContent = selectedCountry;
            document.getElementById('maintenanceTitle').textContent = t.maintenanceTitle;
            document.getElementById('maintenanceWork').textContent = t.maintenanceWork;
            document.getElementById('maintenanceSorry').textContent = t.maintenanceSorry;
        }

        // ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА =====
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentLang = this.dataset.lang;
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                updateText();
            });
        });

        // ===== ПОИСК СТРАН =====
        const searchInput = document.getElementById('searchInput');
        const searchDropdown = document.getElementById('searchDropdown');

        function renderCountries(filter = '') {
            const countries = Object.keys(timezones).filter(c => c.toLowerCase().includes(filter.toLowerCase()));
            searchDropdown.innerHTML = countries.map(c => `<div class="country-item">${c}</div>`).join('');
            
            document.querySelectorAll('.country-item').forEach(item => {
                item.addEventListener('click', function() {
                    selectedCountry = this.textContent;
                    selectedTimezone = timezones[selectedCountry];
                    searchInput.value = '';
                    searchDropdown.style.display = 'none';
                    updateClock();
                    updateText();
                });
            });
        }

        searchInput.addEventListener('input', function() {
            const val = this.value;
            if (val.length > 0) {
                searchDropdown.style.display = 'block';
                renderCountries(val);
            } else {
                searchDropdown.style.display = 'none';
            }
        });

        // Закрытие дропдауна при клике вне
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box')) {
                searchDropdown.style.display = 'none';
            }
        });

        // ===== ЗВЕЗДОПАД =====
        function createStars() {
            const container = document.getElementById('starContainer');
            const starCount = 60;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 4 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `-${Math.random() * 20}vh`;
                
                const duration = Math.random() * 3 + 2;
                star.style.animationDuration = `${duration}s`;
                
                const delay = Math.random() * 5;
                star.style.animationDelay = `${delay}s`;
                
                container.appendChild(star);
            }
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        document.addEventListener('DOMContentLoaded', function() {
            updateClock();
            setInterval(updateClock, 1000);
            updateText();
            renderCountries();
            createStars();
        });
    </script>

</body>
</html>
