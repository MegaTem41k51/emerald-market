<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы — EMERALD Market</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #050a06;
            color: #b0ffb0;
            overflow: hidden;
            position: relative;
        }

        /* ===== ЗВЕЗДОПАД ===== */
        .star-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(120vh) translateX(-20vw);
                opacity: 0;
            }
        }

        /* ===== ЦЕНТРАЛЬНЫЙ БЛОК ===== */
        .maintenance-box {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* ===== ПОИСК ===== */
        .search-box {
            position: relative;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            margin-bottom: 40px;
            cursor: pointer;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #d4ffd4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 10px 12px;
            width: 220px;
            cursor: pointer;
        }

        .search-input::placeholder {
            color: #7ea87e;
        }

        .search-dropdown {
            display: none;
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: #050a06;
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
        }

        .search-dropdown::-webkit-scrollbar {
            width: 4px;
        }
        .search-dropdown::-webkit-scrollbar-track {
            background: transparent;
        }
        .search-dropdown::-webkit-scrollbar-thumb {
            background: #2b6e2b;
        }

        .country-item {
            padding: 8px 12px;
            color: #9fff9f;
            font-size: 13px;
            cursor: pointer;
        }

        .country-item:hover {
            background: rgba(159, 255, 159, 0.2);
        }

        /* ===== ЦИФРОВЫЕ ЧАСЫ ===== */
        .digital-clock {
            font-size: 120px;
            font-weight: 900;
            letter-spacing: 10px;
            color: #ccffcc;
            text-shadow:
                0 0 10px #62c462,
                0 0 20px #62c462,
                0 0 40px #2b6e2b,
                0 0 80px #1a4a1a;
            margin-bottom: 20px;
            user-select: none;
        }

        .clock-label {
            font-size: 16px;
            letter-spacing: 4px;
            color: #7ea87e;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* ===== ТЕКСТ ===== */
        .maintenance-text {
            font-size: 22px;
            line-height: 1.7;
            color: #d4ffd4;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 12px;
            padding: 30px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .maintenance-text .icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: block;
        }

        .maintenance-text .bold {
            font-weight: bold;
            color: #9fff9f;
        }

        .maintenance-text p {
            margin-bottom: 12px;
        }

        /* ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА (ПРАВЫЙ НИЖНИЙ УГОЛ) ===== */
        .lang-switch {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 6px;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            padding: 4px;
            cursor: pointer;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #7ea87e;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #9fff9f;
            color: #050a06;
            text-shadow: none;
        }

        @media (max-width: 600px) {
            .digital-clock {
                font-size: 60px;
                letter-spacing: 6px;
                margin-bottom: 20px;
            }
            .clock-label {
                font-size: 12px;
                margin-bottom: 20px;
            }
            .maintenance-text {
                font-size: 16px;
                padding: 20px;
            }
            .maintenance-text .icon {
                font-size: 36px;
            }
            .search-input {
                width: 160px;
            }
            .lang-switch {
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ЗВЕЗДОПАД -->
    <div class="star-container" id="starContainer"></div>

    <!-- ЯЗЫК: В ПРАВОМ НИЖНЕМ УГЛУ -->
    <div class="lang-switch" id="langSwitch">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <div class="maintenance-box">

        <!-- ПОИСК СТРАН (открывается по клику, список по алфавиту) -->
        <div class="search-box" id="searchBox">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск страны..." readonly>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>

        <!-- Часы -->
        <div class="digital-clock" id="clock">00:00:00</div>
        <div class="clock-label" id="clockLabel">Москва</div>

        <!-- Текст -->
        <div class="maintenance-text">
            <span class="icon">🔧</span>
            <p class="bold" id="maintenanceTitle">В данный момент могут наблюдаться проблемы с доступом к сайту</p>
            <p id="maintenanceWork">Работаем над исправлением 🙏</p>
            <p id="maintenanceSorry">Простите за неудобства</p>
        </div>
    </div>

    <script>
        // ===== ЯЗЫК =====
        let currentLang = 'ru';

        const translations = {
            ru: {
                searchPlaceholder: 'Поиск страны...',
                maintenanceTitle: 'В данный момент могут наблюдаться проблемы с доступом к сайту',
                maintenanceWork: 'Работаем над исправлением 🙏',
                maintenanceSorry: 'Простите за неудобства'
            },
            en: {
                searchPlaceholder: 'Search country...',
                maintenanceTitle: 'There may be some issues with the site access at the moment',
                maintenanceWork: 'We are working on fixing it 🙏',
                maintenanceSorry: 'Sorry for the inconvenience'
            }
        };

        // ===== ЧАСОВЫЕ ПОЯСА (ВСЕ СТРАНЫ, СПИСОК ПО АЛФАВИТУ) =====
        const countries = [
            'Австралия', 'Австрия', 'Азербайджан', 'Албания', 'Алжир', 'Ангола',
            'Аргентина', 'Армения', 'Афганистан', 'Багамы', 'Бангладеш', 'Барбадос',
            'Бахрейн', 'Беларусь', 'Бельгия', 'Белиз', 'Бенин', 'Болгария',
            'Боливия', 'Босния и Герцеговина', 'Ботсвана', 'Бразилия', 'Бруней',
            'Буркина-Фасо', 'Бурунди', 'Бутан', 'Вануату', 'Великобритания',
            'Венгрия', 'Венесуэла', 'Вьетнам', 'Габон', 'Гаити', 'Гайана',
            'Гамбия', 'Гана', 'Гватемала', 'Гвинея', 'Германия', 'Гондурас',
            'Гренада', 'Греция', 'Грузия', 'Дания', 'Джибути', 'Доминикана',
            'Египет', 'Замбия', 'Зимбабве', 'Израиль', 'Индия', 'Индонезия',
            'Иордания', 'Ирак', 'Иран', 'Ирландия', 'Исландия', 'Испания',
            'Италия', 'Йемен', 'Казахстан', 'Камбоджа', 'Камерун', 'Канада',
            'Катар', 'Кения', 'Кипр', 'Киргизия', 'Китай', 'Колумбия',
            'Конго', 'Корея', 'Коста-Рика', 'Кот-д’Ивуар', 'Куба', 'Кувейт',
            'Лаос', 'Латвия', 'Ливан', 'Ливия', 'Литва', 'Люксембург',
            'Маврикий', 'Мавритания', 'Мадагаскар', 'Малави', 'Малайзия',
            'Мали', 'Мальдивы', 'Мальта', 'Марокко', 'Мексика', 'Мозамбик',
            'Молдова', 'Монголия', 'Мьянма', 'Намибия', 'Непал', 'Нигерия',
            'Нидерланды', 'Никарагуа', 'Новая Зеландия', 'Норвегия', 'ОАЭ',
            'Оман', 'Пакистан', 'Панама', 'Парагвай', 'Перу', 'Польша',
            'Португалия', 'Россия', 'Румыния', 'Сальвадор', 'Саудовская Аравия',
            'Северная Македония', 'Сенегал', 'Сербия', 'Сингапур', 'Сирия',
            'Словакия', 'Словения', 'Сомали', 'Судан', 'США', 'Сьерра-Леоне',
            'Таджикистан', 'Таиланд', 'Танзания', 'Тунис', 'Туркменистан',
            'Турция', 'Уганда', 'Узбекистан', 'Украина', 'Уругвай',
            'Филиппины', 'Финляндия', 'Франция', 'Хорватия', 'Черногория',
            'Чехия', 'Чили', 'Швейцария', 'Швеция', 'Эквадор', 'Эстония',
            'Эфиопия', 'ЮАР', 'Ямайка', 'Япония'
        ];

        const timezoneMap = {
            'Россия': 'Europe/Moscow',
            'США': 'America/New_York',
            'Великобритания': 'Europe/London',
            'Франция': 'Europe/Paris',
            'Германия': 'Europe/Berlin',
            'Италия': 'Europe/Rome',
            'Испания': 'Europe/Madrid',
            'Китай': 'Asia/Shanghai',
            'Япония': 'Asia/Tokyo',
            'Индия': 'Asia/Kolkata',
            'Австралия': 'Australia/Sydney',
            'Канада': 'America/Toronto',
            'Бразилия': 'America/Sao_Paulo',
            'Мексика': 'America/Mexico_City',
            'Турция': 'Europe/Istanbul',
            'ОАЭ': 'Asia/Dubai',
            'Казахстан': 'Asia/Almaty',
            'Украина': 'Europe/Kyiv',
            'Беларусь': 'Europe/Minsk',
            'Польша': 'Europe/Warsaw',
            'Чехия': 'Europe/Prague',
            'Швеция': 'Europe/Stockholm',
            'Норвегия': 'Europe/Oslo',
            'Финляндия': 'Europe/Helsinki',
            'Дания': 'Europe/Copenhagen',
            'Нидерланды': 'Europe/Amsterdam',
            'Бельгия': 'Europe/Brussels',
            'Австрия': 'Europe/Vienna',
            'Швейцария': 'Europe/Zurich',
            'Греция': 'Europe/Athens',
            'Португалия': 'Europe/Lisbon',
            'Ирландия': 'Europe/Dublin',
            'Аргентина': 'America/Argentina/Buenos_Aires',
            'Чили': 'America/Santiago',
            'Колумбия': 'America/Bogota',
            'Перу': 'America/Lima',
            'ЮАР': 'Africa/Johannesburg',
            'Египет': 'Africa/Cairo',
            'Израиль': 'Asia/Jerusalem',
            'Саудовская Аравия': 'Asia/Riyadh',
            'Иран': 'Asia/Tehran',
            'Ирак': 'Asia/Baghdad',
            'Сирия': 'Asia/Damascus',
            'Иордания': 'Asia/Amman',
            'Ливан': 'Asia/Beirut',
            'Азербайджан': 'Asia/Baku',
            'Грузия': 'Asia/Tbilisi',
            'Армения': 'Asia/Yerevan',
            'Узбекистан': 'Asia/Tashkent',
            'Таджикистан': 'Asia/Dushanbe',
            'Туркменистан': 'Asia/Ashgabat',
            'Киргизия': 'Asia/Bishkek',
            'Монголия': 'Asia/Ulaanbaatar',
            'Индонезия': 'Asia/Jakarta',
            'Малайзия': 'Asia/Kuala_Lumpur',
            'Сингапур': 'Asia/Singapore',
            'Таиланд': 'Asia/Bangkok',
            'Вьетнам': 'Asia/Ho_Chi_Minh',
            'Филиппины': 'Asia/Manila',
            'Южная Корея': 'Asia/Seoul',
            'Новая Зеландия': 'Pacific/Auckland'
        };

        let selectedCountry = 'Россия';
        let selectedTimezone = 'Europe/Moscow';

        // ===== ФУНКЦИИ =====
        function updateClock() {
            const now = new Date();
            const timeStr = new Date(now.toLocaleString('en-US', { timeZone: selectedTimezone }));
            const hours = String(timeStr.getHours()).padStart(2, '0');
            const minutes = String(timeStr.getMinutes()).padStart(2, '0');
            const seconds = String(timeStr.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // ===== ОБНОВЛЕНИЕ ТЕКСТА =====
        function updateText() {
            const t = translations[currentLang];
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('clockLabel').textContent = selectedCountry;
            document.getElementById('maintenanceTitle').textContent = t.maintenanceTitle;
            document.getElementById('maintenanceWork').textContent = t.maintenanceWork;
            document.getElementById('maintenanceSorry').textContent = t.maintenanceSorry;
        }

        // ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА =====
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentLang = this.dataset.lang;
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                updateText();
            });
        });

        // ===== ПОИСК (клик по строке - открывается список по алфавиту) =====
        const searchBox = document.getElementById('searchBox');
        const searchInput = document.getElementById('searchInput');
        const searchDropdown = document.getElementById('searchDropdown');

        function renderCountries(filter = '') {
            const filtered = countries.filter(c => c.toLowerCase().includes(filter.toLowerCase()));
            searchDropdown.innerHTML = filtered.map(c => `<div class="country-item">${c}</div>`).join('');
            
            document.querySelectorAll('.country-item').forEach(item => {
                item.addEventListener('click', function() {
                    selectedCountry = this.textContent;
                    selectedTimezone = timezoneMap[selectedCountry] || 'Europe/Moscow';
                    searchInput.value = '';
                    searchDropdown.style.display = 'none';
                    updateClock();
                    updateText();
                });
            });
        }

        // По клику на строку открываем полный список
        searchBox.addEventListener('click', function() {
            renderCountries();
            searchDropdown.style.display = 'block';
        });

        searchInput.addEventListener('input', function() {
            const val = this.value;
            if (val.length > 0) {
                searchDropdown.style.display = 'block';
                renderCountries(val);
            } else {
                searchDropdown.style.display = 'block';
                renderCountries();
            }
        });

        // Закрытие дропдауна при клике вне
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box')) {
                searchDropdown.style.display = 'none';
            }
        });

        // ===== ЗВЕЗДОПАД =====
        function createStars() {
            const container = document.getElementById('starContainer');
            const starCount = 60;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 4 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `-${Math.random() * 20}vh`;
                
                const duration = Math.random() * 3 + 2;
                star.style.animationDuration = `${duration}s`;
                
                const delay = Math.random() * 5;
                star.style.animationDelay = `${delay}s`;
                
                container.appendChild(star);
            }
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        document.addEventListener('DOMContentLoaded', function() {
            updateClock();
            setInterval(updateClock, 1000);
            updateText();
            createStars();
        });
    </script>

</body>
</html>
