<script>
// ===== МОДАЛКА =====
function showModal(title, text) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

// ===== ЛОГИКА STEAM =====
let currentUser = null;
let userInventory = [];
let selectedSteamSkins = [];
let usdToRubRate = 90; // Примерный курс

async function fetchUser() {
    const response = await fetch('/api/user');
    const data = await response.json();
    if (data.loggedIn) {
        currentUser = { id: data.user.id, name: data.user.name, avatar: data.user.avatar };
        updateUserUI();
        renderProfile();
        loadTradeUrl();
        loadSettings();
        // Автоматически загружаем инвентарь при входе
        setTimeout(loadSteamInventory, 1000);
    } else {
        currentUser = null;
        updateUserUI();
        renderProfile();
    }
}

function logoutUser() { window.location.href = '/logout'; }

function updateUserUI() {
    const actions = document.getElementById('headerActions');
    if (currentUser) {
        actions.innerHTML = `
            <div class="steam-user" style="cursor:pointer;" onclick="navigateTo('profile')">
                <div class="steam-avatar" style="background-image:url('${currentUser.avatar}');"></div>
                <span class="steam-name">${currentUser.name}</span>
                <button class="steam-logout" onclick="event.stopPropagation(); logoutUser()">✕</button>
            </div>
        `;
    } else {
        actions.innerHTML = `<a href="/auth/steam" class="btn btn-steam">Войти через Steam</a>`;
    }
}

// ===== НАСТРОЙКИ (сохраняются на сервере!) =====
async function loadSettings() {
    const response = await fetch('/api/get-settings');
    const data = await response.json();
    
    if (data.theme === 'light') {
        document.body.classList.add('light');
        document.getElementById('themeToggle').classList.remove('active');
        document.getElementById('themeToggleLight').classList.add('active');
    } else {
        document.body.classList.remove('light');
        document.getElementById('themeToggle').classList.add('active');
        document.getElementById('themeToggleLight').classList.remove('active');
    }
    
    if (data.rain) {
        document.getElementById('rainContainer').style.display = 'block';
        document.getElementById('rainToggle').classList.add('active');
        document.getElementById('rainToggleOff').classList.remove('active');
    } else {
        document.getElementById('rainContainer').style.display = 'none';
        document.getElementById('rainToggle').classList.remove('active');
        document.getElementById('rainToggleOff').classList.add('active');
    }
}

async function saveSettings() {
    const theme = document.body.classList.contains('light') ? 'light' : 'dark';
    const rain = document.getElementById('rainContainer').style.display !== 'none';
    await fetch('/api/save-settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ theme, rain })
    });
}

document.getElementById('themeToggle').addEventListener('click', function() {
    document.body.classList.remove('light');
    this.classList.add('active');
    document.getElementById('themeToggleLight').classList.remove('active');
    saveSettings();
});

document.getElementById('themeToggleLight').addEventListener('click', function() {
    document.body.classList.add('light');
    this.classList.add('active');
    document.getElementById('themeToggle').classList.remove('active');
    saveSettings();
});

document.getElementById('rainToggle').addEventListener('click', function() {
    document.getElementById('rainContainer').style.display = 'block';
    this.classList.add('active');
    document.getElementById('rainToggleOff').classList.remove('active');
    saveSettings();
});

document.getElementById('rainToggleOff').addEventListener('click', function() {
    document.getElementById('rainContainer').style.display = 'none';
    this.classList.add('active');
    document.getElementById('rainToggle').classList.remove('active');
    saveSettings();
});

// ===== TRADE URL =====
async function loadTradeUrl() {
    const response = await fetch('/api/get-trade-url');
    const data = await response.json();
    if (data.tradeUrl) {
        document.getElementById('sellTradeUrl').value = data.tradeUrl;
        document.getElementById('profileTradeUrl').value = data.tradeUrl;
    }
}

async function saveTradeUrl() {
    const url = document.getElementById('sellTradeUrl').value.trim();
    if (!url) { showModal('Ошибка', 'Введите Trade URL!'); return; }
    
    document.getElementById('profileTradeUrl').value = url;
    await fetch('/api/save-trade-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tradeUrl: url })
    });
    showModal('Успех', 'Trade URL сохранен! Сейчас загрузим скины...');
    loadSteamInventory();
}

async function saveProfileTradeUrl() {
    const url = document.getElementById('profileTradeUrl').value.trim();
    if (!url) { showModal('Ошибка', 'Введите Trade URL!'); return; }
    
    document.getElementById('sellTradeUrl').value = url;
    await fetch('/api/save-trade-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tradeUrl: url })
    });
    showModal('Успех', 'Trade URL сохранен! Сейчас загрузим скины...');
    loadSteamInventory();
}

// ===== ИНВЕНТАРЬ С РЕАЛЬНЫМИ ЦЕНАМИ STEAM =====
async function loadSteamInventory() {
    if (!currentUser) {
        showModal('Ошибка', 'Пожалуйста, войдите через Steam!');
        return;
    }

    const grid = document.getElementById('sellSkinGrid');
    grid.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #8a8d99;">
            ⏳ Загружаем ваш инвентарь CS2 с реальными ценами Steam...
        </div>
    `;

    try {
        const response = await fetch('/api/get-inventory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });

        const data = await response.json();

        if (!response.ok || data.error) {
            grid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #e74c3c;">
                    ❌ ${escapeHtml(data.error || 'Не удалось загрузить инвентарь')}
                </div>
            `;
            return;
        }

        userInventory = data.items || [];
        selectedSteamSkins = [];

        if (userInventory.length === 0) {
            grid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #8a8d99;">
                    <div style="font-size: 40px; margin-bottom: 15px;">📦</div>
                    <div style="font-size: 16px; color: #fff; margin-bottom: 8px;">Скины не найдены</div>
                    <div>Убедитесь, что ваш инвентарь Steam открыт и в нем есть скины CS2.</div>
                </div>
            `;
            return;
        }

        grid.innerHTML = userInventory.map((item, index) => {
            const available = item.tradable !== false && item.price >= 0.05;
            const priceDisplay = item.price > 0 ? `$${item.price.toFixed(2)}` : 'Цена не найдена';
            const priceRub = item.price > 0 ? `${Math.round(item.price * usdToRubRate)} ₽` : '—';

            return `
                <div class="sell-skin-card ${!available ? 'unavailable' : ''}"
                     onclick="toggleSteamSkinSelection(${index})">
                    ${!available ? `
                        <div class="unavailable-badge">Недоступно</div>
                        <div class="unavailable-tooltip">
                            ${item.price === 0 ? 'Цена не определена' : 'Этот предмет недоступен для продажи'}
                        </div>
                    ` : `
                        <div class="sell-badge">${escapeHtml(item.type || 'Скин')}</div>
                    `}
                    <div class="image">
                        ${item.image ? `
                            <img src="${item.image}" alt="${escapeHtml(item.name)}" loading="lazy">
                        ` : `
                            <span style="color:#666; font-size:30px;">🎮</span>
                        `}
                    </div>
                    <div class="name">${escapeHtml(item.name)}</div>
                    <div class="price" style="color: ${available ? (item.price > 0 ? '#2ecc71' : '#f39c12') : '#e74c3c'};">
                        ${available ? priceDisplay : 'Недоступно'}
                        ${available && item.price > 0 ? `<span style="font-size:11px;color:#8a8d99;display:block;">${priceRub}</span>` : ''}
                    </div>
                    <div class="selected-check">✓</div>
                </div>
            `;
        }).join('');

        console.log('Загружено скинов с ценами:', userInventory.length);

    } catch (error) {
        console.error('Ошибка загрузки инвентаря:', error);
        grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #e74c3c;">
                ❌ Ошибка подключения к серверу.
            </div>
        `;
    }
}

// ===== ВЫБОР СКИНОВ =====
function toggleSteamSkinSelection(index) {
    const item = userInventory[index];
    if (!item || item.tradable === false || item.price === 0) return;

    const cardIndex = selectedSteamSkins.indexOf(index);
    if (cardIndex === -1) {
        selectedSteamSkins.push(index);
    } else {
        selectedSteamSkins.splice(cardIndex, 1);
    }

    updateSellSidebar();
    updateSellSkinCards();
}

function updateSellSkinCards() {
    const cards = document.querySelectorAll('.sell-skin-card');
    cards.forEach((card, idx) => {
        const isSelected = selectedSteamSkins.includes(idx);
        card.classList.toggle('selected', isSelected);
    });
}

function updateSellSidebar() {
    const totalItems = selectedSteamSkins.length;
    const totalPrice = selectedSteamSkins.reduce((sum, idx) => {
        const item = userInventory[idx];
        return sum + (item.price || 0);
    }, 0);
    const totalRub = Math.round(totalPrice * usdToRubRate);

    const sidebar = document.querySelector('.sell-sidebar h3');
    if (sidebar) {
        sidebar.textContent = `Выбрано ${totalItems} скинов на ${totalRub.toLocaleString()} ₽`;
    }

    const infoBoxes = document.querySelectorAll('.info-box');
    infoBoxes.forEach(box => {
        const labels = box.querySelectorAll('label');
        const divs = box.querySelectorAll('div');
        if (labels.length >= 2 && divs.length >= 2) {
            // Общая стоимость
            const totalPriceEl = divs[0];
            if (totalPriceEl) {
                totalPriceEl.textContent = `${totalRub.toLocaleString()} ₽`;
            }
            // К выплате (95% от суммы, комиссия 5%)
            const payoutEl = divs[1];
            if (payoutEl) {
                const payoutRub = Math.round(totalRub * 0.95);
                payoutEl.textContent = `${payoutRub.toLocaleString()} ₽`;
            }
        }
    });

    // Обновляем кнопку продажи
    const sellBtn = document.querySelector('.sell-final-btn');
    if (sellBtn) {
        sellBtn.textContent = totalItems > 0 ? `Продать ${totalItems} скинов` : 'Продать';
    }
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

// ===== НАВИГАЦИЯ =====
function navigateTo(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById(page + 'Page');
    if (target) target.classList.add('active');
    document.querySelectorAll('.nav a').forEach(a => {
        if (a.dataset.page === page) {
            a.classList.add('active');
        } else {
            a.classList.remove('active');
        }
    });
}

// ===== ПРОФИЛЬ =====
function renderProfile() {
    if (currentUser) {
        document.getElementById('profileLoginBox').style.display = 'none';
        document.getElementById('profileContent').style.display = 'block';
        document.getElementById('profileName').textContent = currentUser.name;
        if (currentUser.avatar) {
            document.getElementById('profileAvatar').style.backgroundImage = `url('${currentUser.avatar}')`;
            document.getElementById('profileAvatar').style.backgroundSize = 'cover';
            document.getElementById('profileAvatar').style.backgroundPosition = 'center';
            document.getElementById('profileAvatar').textContent = '';
        } else {
            document.getElementById('profileAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
        }
    } else {
        document.getElementById('profileLoginBox').style.display = 'block';
        document.getElementById('profileContent').style.display = 'none';
    }
}

// ===== ВКЛАДКИ ПРОФИЛЯ =====
document.querySelectorAll('.profile-tab').forEach(tab => {
    tab.addEventListener('click', function() {
        const tabName = this.dataset.tab;
        document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.profile-content-section').forEach(section => {
            section.classList.remove('active');
        });
        document.getElementById('section-' + tabName).classList.add('active');
    });
});

// ===== ИНИЦИАЛИЗАЦИЯ =====
document.addEventListener('DOMContentLoaded', function() {
    fetchUser();
    
    // Дождь
    const container = document.getElementById('rainContainer');
    for (let i = 0; i < 80; i++) {
        const drop = document.createElement('div');
        drop.className = 'rain';
        const speed = ['rain-slow', 'rain-medium', 'rain-fast'][Math.floor(Math.random() * 3)];
        drop.classList.add(speed);
        drop.style.left = Math.random() * 100 + '%';
        drop.style.height = (10 + Math.random() * 30) + 'px';
        drop.style.animationDelay = Math.random() * 3 + 's';
        drop.style.animationDuration = (1.2 + Math.random() * 2) + 's';
        container.appendChild(drop);
    }

    // Навигация
    document.querySelectorAll('.nav a').forEach(el => {
        el.addEventListener('click', function(e) {
            e.preventDefault();
            const page = this.dataset.page;
            if (page) navigateTo(page);
        });
    });
    document.getElementById('logoLink').addEventListener('click', function(e) {
        e.preventDefault();
        navigateTo('sell');
    });

    // Методы оплаты
    document.querySelectorAll('.pay-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Обновление выбранных скинов при изменении фильтров
    const filterInput = document.querySelector('.filter-input');
    if (filterInput) {
        filterInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const cards = document.querySelectorAll('.sell-skin-card');
            cards.forEach((card, index) => {
                const name = card.querySelector('.name')?.textContent?.toLowerCase() || '';
                card.style.display = name.includes(query) ? 'flex' : 'none';
            });
        });
    }
});
</script>
