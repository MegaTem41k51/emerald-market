<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы — EMERALD Market</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #050a06;
            color: #b0ffb0;
            overflow: hidden;
            position: relative;
        }

        /* ===== ЗВЕЗДОПАД ===== */
        .star-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(120vh) translateX(-20vw);
                opacity: 0;
            }
        }

        /* ===== ЦЕНТРАЛЬНЫЙ БЛОК ===== */
        .maintenance-box {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* ===== ЧАСЫ ===== */
        .digital-clock {
            font-size: 120px;
            font-weight: 900;
            letter-spacing: 10px;
            color: #ccffcc;
            text-shadow:
                0 0 10px #62c462,
                0 0 20px #62c462,
                0 0 40px #2b6e2b,
                0 0 80px #1a4a1a;
            margin-bottom: 20px;
            user-select: none;
        }

        .clock-label {
            font-size: 16px;
            letter-spacing: 4px;
            color: #7ea87e;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* ===== ОБРАТНЫЙ ТАЙМЕР ===== */
        .countdown-title {
            color: #7ea87e;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .countdown {
            font-size: 50px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ccffcc;
            text-shadow:
                0 0 10px #62c462,
                0 0 20px #62c462,
                0 0 40px #2b6e2b;
            margin-bottom: 40px;
        }

        /* ===== ТЕКСТ ===== */
        .maintenance-text {
            font-size: 22px;
            line-height: 1.7;
            color: #d4ffd4;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 12px;
            padding: 30px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .maintenance-text .icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: block;
        }

        .maintenance-text .bold {
            font-weight: bold;
            color: #9fff9f;
        }

        .maintenance-text p {
            margin-bottom: 12px;
        }

        /* ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА (ПРАВЫЙ НИЖНИЙ УГОЛ) ===== */
        .lang-switch {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 6px;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            padding: 4px;
            cursor: pointer;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #7ea87e;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #9fff9f;
            color: #050a06;
            text-shadow: none;
        }

        @media (max-width: 600px) {
            .digital-clock {
                font-size: 60px;
                letter-spacing: 6px;
                margin-bottom: 20px;
            }
            .countdown {
                font-size: 30px;
                letter-spacing: 3px;
            }
            .maintenance-text {
                font-size: 16px;
                padding: 20px;
            }
            .lang-switch {
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ЗВЕЗДОПАД -->
    <div class="star-container" id="starContainer"></div>

    <div class="maintenance-box">

        <!-- Часы МСК -->
        <div class="digital-clock" id="clock">00:00:00</div>
        <div class="clock-label" id="clockLabel">МСК</div>

        <!-- Текст -->
        <div class="maintenance-text">
            <span class="icon">🔧</span>
            <p class="bold" id="maintenanceTitle">В данный момент могут наблюдаться проблемы с доступом к сайту</p>
            <p id="maintenanceWork">Работаем над исправлением 🙏</p>
            <p id="maintenanceSorry">Простите за неудобства</p>
        </div>
    </div>

    !-- Обратный таймер -->
        <div class="countdown-title">До окончания работ осталось</div>
        <div class="countdown" id="countdown">12:00:00</div>
        
    <!-- ЯЗЫК: В ПРАВОМ НИЖНЕМ УГЛУ -->
    <div class="lang-switch" id="langSwitch">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <script>
        // ===== ЯЗЫК =====
        let currentLang = 'ru';

        const translations = {
            ru: {
                clockLabel: 'МСК',
                countdownTitle: 'До окончания работ осталось',
                maintenanceTitle: 'В данный момент могут наблюдаться проблемы с доступом к сайту',
                maintenanceWork: 'Работаем над исправлением 🙏',
                maintenanceSorry: 'Простите за неудобства'
            },
            en: {
                clockLabel: 'MSK',
                countdownTitle: 'Time remaining until the end of work',
                maintenanceTitle: 'There may be some issues with the site access at the moment',
                maintenanceWork: 'We are working on fixing it 🙏',
                maintenanceSorry: 'Sorry for the inconvenience'
            }
        };

        // ===== ВРЕМЯ (МСК по умолчанию) =====
        let timezone = 'Europe/Moscow'; // Всегда МСК изначально

        function updateClock() {
            const now = new Date();
            const timeStr = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
            const hours = String(timeStr.getHours()).padStart(2, '0');
            const minutes = String(timeStr.getMinutes()).padStart(2, '0');
            const seconds = String(timeStr.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // ===== ОБРАТНЫЙ ТАЙМЕР 12 ЧАСОВ =====
        let totalSeconds = 12 * 60 * 60; // 12 часов в секундах

        function updateCountdown() {
            if (totalSeconds <= 0) return; // Если время вышло, останавливаемся

            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const formatted = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('countdown').textContent = formatted;

            totalSeconds--;
        }

        // ===== ОБНОВЛЕНИЕ ТЕКСТА =====
        function updateText() {
            const t = translations[currentLang];
            document.getElementById('clockLabel').textContent = t.clockLabel;
            document.getElementById('countdown').textContent = ''; // Сбрасываем, чтобы заголовок обновился
            document.getElementById('countdown').previousElementSibling.textContent = t.countdownTitle;
            document.getElementById('maintenanceTitle').textContent = t.maintenanceTitle;
            document.getElementById('maintenanceWork').textContent = t.maintenanceWork;
            document.getElementById('maintenanceSorry').textContent = t.maintenanceSorry;
        }

        // ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА =====
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentLang = this.dataset.lang;
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                updateText();
            });
        });

        // ===== ЗВЕЗДОПАД =====
        function createStars() {
            const container = document.getElementById('starContainer');
            const starCount = 60;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 4 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `-${Math.random() * 20}vh`;
                
                const duration = Math.random() * 3 + 2;
                star.style.animationDuration = `${duration}s`;
                
                const delay = Math.random() * 5;
                star.style.animationDelay = `${delay}s`;
                
                container.appendChild(star);
            }
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        document.addEventListener('DOMContentLoaded', function() {
            updateClock();
            setInterval(updateClock, 1000);
            
            // Таймер начинает тикать сразу
            updateCountdown();
            setInterval(updateCountdown, 1000);
            
            updateText();
            createStars();
        });
    </script>

</body>
</html>
