<script>
let currentUser = null;
let userInventory = [];
let selectedSteamSkins = [];

// 1. Получаем авторизацию
async function fetchUser() {
    const response = await fetch('/api/user');
    const data = await response.json();
    if (data.loggedIn) {
        currentUser = data.user;
        updateUserUI();
        loadTradeUrl(); // Проверяем сохранённую ссылку
    }
}

// 2. Загрузка инвентаря (ВСЕГДА через сервер!)
async function loadSteamInventory() {
    if (!currentUser) { alert('Сначала войди через Steam!'); return; }
    
    const grid = document.getElementById('sellSkinGrid');
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#8a8d99;">⏳ Загружаем... (обычно занимает 5-10 секунд)</div>';
    
    try {
        // Сервер делает запрос, обходя CORS и баны
        const response = await fetch('/api/get-inventory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
        
        const data = await response.json();
        if (data.error) { alert(data.error); return; }
        
        userInventory = data.items || [];
        if (userInventory.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#8a8d99;">Инвентарь пуст или скрыт.</div>';
            return;
        }
        
        // Отображаем скины
        grid.innerHTML = userInventory.map((item, index) => `
            <div class="skin-card" onclick="toggleSkinSelection(${index})">
                <div class="badge">${item.type || 'Скин'}</div>
                <div class="image">${item.image ? `<img src="${item.image}">` : ''}</div>
                <div class="name">${item.name}</div>
                <div class="price">0,00 ₽</div>
            </div>
        `).join('');
    } catch (e) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#8a8d99;">Ошибка связи с сервером.</div>';
    }
}

// 3. Сохранение и авто-загрузка
document.addEventListener('DOMContentLoaded', async function() {
    await fetchUser();
    
    document.getElementById('tradeUrlInput').addEventListener('blur', async function() {
        const url = this.value.trim();
        if (url) {
            // Сохраняем на сервере
            await fetch('/api/save-trade-url', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tradeUrl: url })
            });
            // Сразу грузим
            loadSteamInventory();
        }
    });
});

function updateUserUI() { /* ... существующий код ... */ }
function toggleSkinSelection(index) { /* ... существующий код ... */ }
</script>
