<!DOCTYPE html>
<html lang="ru">

    <title>Технические работы — EMERALD Market</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #050a06;
            color: #b0ffb0;
            overflow: hidden;
            position: relative;
        }

        /* ===== ЗВЕЗДОПАД ===== */
        .star-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(120vh) translateX(-20vw);
                opacity: 0;
            }
        }

        /* ===== ЦЕНТРАЛЬНЫЙ БЛОК ===== */
        .maintenance-box {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* ===== ПОИСК ===== */
        .search-box {
            position: relative;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            margin-bottom: 40px;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #d4ffd4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 10px 12px;
            width: 220px;
        }

        .search-input::placeholder {
            color: #7ea87e;
        }

        .search-dropdown {
            display: none;
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: #050a06;
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
        }

        .search-dropdown::-webkit-scrollbar {
            width: 4px;
        }
        .search-dropdown::-webkit-scrollbar-track {
            background: transparent;
        }
        .search-dropdown::-webkit-scrollbar-thumb {
            background: #2b6e2b;
        }

        .country-item {
            padding: 8px 12px;
            color: #9fff9f;
            font-size: 13px;
            cursor: pointer;
        }

        .country-item:hover {
            background: rgba(159, 255, 159, 0.2);
        }

        /* ===== ЦИФРОВЫЕ ЧАСЫ ===== */
        .digital-clock {
            font-size: 120px;
            font-weight: 900;
            letter-spacing: 10px;
            color: #ccffcc;
            text-shadow:
                0 0 10px #62c462,
                0 0 20px #62c462,
                0 0 40px #2b6e2b,
                0 0 80px #1a4a1a;
            margin-bottom: 20px;
            user-select: none;
        }

        .clock-label {
            font-size: 16px;
            letter-spacing: 4px;
            color: #7ea87e;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* ===== ОБРАТНЫЙ ТАЙМЕР (ПОД ЧАСАМИ) ===== */
        .countdown-title {
            color: #7ea87e;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .countdown {
            font-size: 50px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ccffcc;
            text-shadow:
                0 0 10px #62c462,
                0 0 20px #62c462,
                0 0 40px #2b6e2b;
            margin-bottom: 40px;
        }

        /* ===== ТЕКСТ ===== */
        .maintenance-text {
            font-size: 22px;
            line-height: 1.7;
            color: #d4ffd4;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 12px;
            padding: 30px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .maintenance-text .icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: block;
        }

        .maintenance-text .bold {
            font-weight: bold;
            color: #9fff9f;
        }

        .maintenance-text p {
            margin-bottom: 12px;
        }

        /* ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА (ПРАВЫЙ НИЖНИЙ УГОЛ) ===== */
        .lang-switch {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 6px;
            background: rgba(20, 40, 20, 0.6);
            border: 1px solid #2b6e2b;
            border-radius: 6px;
            padding: 4px;
            cursor: pointer;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #7ea87e;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #9fff9f;
            color: #050a06;
            text-shadow: none;
        }

            .digital-clock {
                font-size: 60px;
                letter-spacing: 6px;
                margin-bottom: 20px;
            }

                font-size: 16px;
                padding: 20px;
            }
            .search-input {
                width: 160px;
            }
            .lang-switch {
                bottom: 10px;
                right: 10px;
            }
        }

        // Россия по умолчанию (МСК)

        // ===== ФУНКЦИИ =====
        function updateClock() {
            const now = new Date();
            const timeStr = new Date(now.toLocaleString('en-US', { timeZone: selectedCountry.tz }));
            const hours = String(timeStr.getHours()).padStart(2, '0');
            const minutes = String(timeStr.getMinutes()).padStart(2, '0');
            const seconds = String(timeStr.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // ===== ОБРАТНЫЙ ТАЙМЕР 12 ЧАСОВ (НЕ СБРАСЫВАЕТСЯ ПРИ F5) =====
        let totalSeconds = 12 * 60 * 60;
        let workEndTime = null;

        function initTimer() {
            // Пытаемся взять сохраненную дату окончания из localStorage
            const savedEnd = localStorage.getItem('maintenance_end_time');
            
            if (savedEnd) {
                workEndTime = new Date(parseInt(savedEnd));
            } else {
                // Если нет, устанавливаем сейчас + 12 часов и сохраняем
                workEndTime = new Date(Date.now() + totalSeconds * 1000);
                localStorage.setItem('maintenance_end_time', workEndTime.getTime().toString());
            }
        }

        function updateCountdown() {
            if (!workEndTime) return;

            const now = Date.now();
            const diff = Math.floor((workEndTime.getTime() - now) / 1000);

            if (diff <= 0) {
                document.getElementById('countdown').textContent = '00:00:00';
                return;
            }

            const hours = Math.floor(diff / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;

            const formatted = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('countdown').textContent = formatted;
        }

        // ===== ОБНОВЛЕНИЕ ТЕКСТА =====
        function updateText() {
            const t = translations[currentLang];
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('clockLabel').textContent = currentLang === 'ru' ? selectedCountry.ru.toUpperCase() : selectedCountry.en.toUpperCase();
            document.getElementById('countdown').previousElementSibling.textContent = t.countdownTitle;
            document.getElementById('maintenanceTitle').textContent = t.maintenanceTitle;
            document.getElementById('maintenanceWork').textContent = t.maintenanceWork;
            document.getElementById('maintenanceSorry').textContent = t.maintenanceSorry;
        }

        // ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА =====
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentLang = this.dataset.lang;
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                updateText();
            });
        });

        // ===== ПОИСК =====
        const searchInput = document.getElementById('searchInput');
        const searchDropdown = document.getElementById('searchDropdown');

        function renderSuggestions() {
            const query = searchInput.value.trim().toLowerCase();
            let filtered = countries;

            if (query.length > 0) {
                filtered = countries.filter(c => {
                    const name = currentLang === 'ru' ? c.ru : c.en;
                    return name.toLowerCase().includes(query);
                });
            }

            if (filtered.length === 0) {
                searchDropdown.innerHTML = '<div style="padding: 10px; color: #7ea87e;">Не найдено</div>';
            } else {
                searchDropdown.innerHTML = filtered.map(c => `<div class="country-item" data-ru="${c.ru}" data-en="${c.en}" data-tz="${c.tz}">${currentLang === 'ru' ? c.ru : c.en}</div>`).join('');
            }

            searchDropdown.style.display = 'block';
            
            document.querySelectorAll('.country-item').forEach(item => {
                item.addEventListener('click', function() {
                    selectedCountry = {
                        ru: this.dataset.ru,
                        en: this.dataset.en,
                        tz: this.dataset.tz
                    };
                    searchInput.value = '';
                    searchDropdown.style.display = 'none';
                    updateClock();
                    updateText();
                });
            });
        }

        searchInput.addEventListener('input', renderSuggestions);

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box')) {
                searchDropdown.style.display = 'none';
            }
        });

        // ===== ЗВЕЗДОПАД =====
        function createStars() {
            const container = document.getElementById('starContainer');
            const starCount = 60;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 4 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `-${Math.random() * 20}vh`;
                
                const duration = Math.random() * 3 + 2;
                star.style.animationDuration = `${duration}s`;
                
                const delay = Math.random() * 5;
                star.style.animationDelay = `${delay}s`;
                
                container.appendChild(star);
            }
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        document.addEventListener('DOMContentLoaded', function() {
            initTimer();
            
            updateClock();
            setInterval(updateClock, 1000);
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
            
            updateText();
            createStars();
        });
    </script>

</body>
</html>
